---
argument_specs:
  main:
    short_description: "Manage Ubuntu Network and Sysctl"
    description: "Configures static IP addresses using Netplan and optionally sets the unprivileged port start."
    options:
      network_interfaces:
        type: "list"
        elements: "dict"
        required: true
        description: "List of network interface configurations."
        options:
          name:
            type: "str"
            required: true
            description: "The name of the network interface (e.g., eth0)."
          addresses:
            type: "list"
            elements: "str"
            required: true
            description: "List of IP addresses in CIDR notation."
          gateway4:
            type: "str"
            required: false
            description: "IPv4 gateway address."
          nameservers:
            type: "list"
            elements: "str"
            required: false
            description: "List of DNS nameserver IP addresses."
          routes:
            type: "list"
            elements: "dict"
            required: false
            description: "List of custom routes for this interface."
          routing_policy:
            type: "list"
            elements: "dict"
            required: false
            description: "List of routing policy rules for this interface."
      network_sysctl_settings:
        type: "dict"
        required: false
        description: "Dictionary of sysctl settings to apply (e.g., net.ipv4.ip_forward: 1)."
      network_dns_servers:
        type: "list"
        elements: "str"
        required: false
        description: "List of DNS nameserver IP addresses to write to /etc/resolv.conf."
