---
- name: Get pihole user UID
  ansible.builtin.command: "id -u {{ pihole_user }}"
  register: user_id
  changed_when: false

- name: Ensure pihole systemd service is running
  ansible.builtin.systemd:
    name: pihole.service
    scope: user
  register: service_status
  become: true
  become_user: "{{ pihole_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ user_id.stdout }}"
  retries: 10
  delay: 5
  until: service_status.status.ActiveState is defined and service_status.status.ActiveState == 'active'

- name: Assert pihole service is active
  ansible.builtin.assert:
    that:
      - service_status.status.ActiveState == 'active'

- name: Check if pihole container is running via podman
  ansible.builtin.command: podman ps --filter "name=pihole" --format "{% raw %}{{.Status}}{% endraw %}"
  register: podman_status
  become: true
  become_user: "{{ pihole_user }}"
  changed_when: false
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ user_id.stdout }}"
  failed_when: "'Up' not in podman_status.stdout"

- name: Verify ad DNS blocking from host
  ansible.builtin.command: "dig @{{ pihole_verify_ip | default('127.0.0.1') }} pagead2.googlesyndication.com +short"
  register: block_check_host
  failed_when: block_check_host.stdout != "0.0.0.0"
  changed_when: false

- name: Verify ad DNS blocking from host (IPv6)
  ansible.builtin.command: "dig @{{ pihole_verify_ipv6 | default('::1') }} pagead2.googlesyndication.com +short"
  register: block_check_host_ipv6
  failed_when: block_check_host_ipv6.stdout != "0.0.0.0"
  changed_when: false

- name: Verify ad DNS blocking from host (AAAA query resolves to ::)
  ansible.builtin.command: "dig @{{ pihole_verify_ipv6 | default('::1') }} pagead2.googlesyndication.com AAAA +short"
  register: block_check_host_aaaa
  failed_when: block_check_host_aaaa.stdout != "::"
  changed_when: false
