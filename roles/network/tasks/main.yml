---
- name: Set network sysctls
  ansible.builtin.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value | string }}"
    state: present
    reload: yes
    sysctl_file: /etc/sysctl.d/99-network-custom.conf
  loop: "{{ network_sysctl_settings | dict2items }}"
  become: true
  when: network_sysctl_settings is defined and network_sysctl_settings | length > 0

- name: Configure resolv.conf
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: |
      {% for server in network_dns_servers %}
      nameserver {{ server }}
      {% endfor %}
    mode: '0644'
  become: true
  when: network_dns_servers is defined and network_dns_servers | length > 0

- name: Deploy Netplan configuration
  ansible.builtin.template:
    src: netplan.yaml.j2
    dest: /etc/netplan/00-ansible-network.yaml
    mode: '0600'
  become: true
  notify: Apply Netplan
  when: network_interfaces | length > 0
