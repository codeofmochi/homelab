---
- name: Install dnsutils on all hosts
  hosts: all
  become: true
  tasks:
    - name: Install dnsutils
      ansible.builtin.apt:
        name: dnsutils
        state: present
        update_cache: true

- name: Verify pihole-host status before reboot
  hosts: pihole-host
  become: true
  vars:
    pihole_user: pihole
  tasks:
    - name: Run shared Pi-hole host verification tasks
      ansible.builtin.include_role:
        name: pihole
        tasks_from: verify.yml

- name: Verify DHCP and DNS on client-host before reboot
  hosts: client-host
  become: true
  tasks:
    - name: Configure client-host interface to use DHCP
      ansible.builtin.copy:
        dest: /etc/netplan/00-ansible-network.yaml
        content: |
          network:
            version: 2
            renderer: networkd
            ethernets:
              eth1:
                dhcp4: true
                addresses:
                  - "fd00:dead:beef::11/64"
        mode: '0600'

    - name: Remove Vagrant static network configuration
      ansible.builtin.file:
        path: /etc/netplan/50-vagrant.yaml
        state: absent

    - name: Apply Netplan
      ansible.builtin.command: netplan apply

    - name: Wait for client-host to obtain DHCP IP address 192.168.56.150
      ansible.builtin.command: ip addr show eth1
      register: ip_show_output
      until: "'192.168.56.150' in ip_show_output.stdout"
      retries: 20
      delay: 2
      changed_when: false

    - name: Run shared Pi-hole client verification tasks
      ansible.builtin.include_role:
        name: pihole
        tasks_from: verify_client.yml

- name: Reboot hosts
  hosts: all
  become: true
  tasks:
    - name: Reboot the instance to test persistence
      ansible.builtin.reboot:

- name: Verify pihole-host status after reboot
  hosts: pihole-host
  become: true
  vars:
    pihole_user: pihole
  tasks:
    - name: Run shared Pi-hole host verification tasks after reboot
      ansible.builtin.include_role:
        name: pihole
        tasks_from: verify.yml

- name: Verify DHCP and DNS on client-host after reboot
  hosts: client-host
  become: true
  tasks:
    - name: Wait for client-host to obtain DHCP IP address after reboot
      ansible.builtin.command: ip addr show eth1
      register: ip_show_output_post
      until: "'192.168.56.150' in ip_show_output_post.stdout"
      retries: 30
      delay: 2
      changed_when: false

    - name: Run shared Pi-hole client verification tasks after reboot
      ansible.builtin.include_role:
        name: pihole
        tasks_from: verify_client.yml
