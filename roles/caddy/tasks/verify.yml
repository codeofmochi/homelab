---
- name: Get caddy user UID
  ansible.builtin.getent:
    database: passwd
    key: "{{ caddy_user }}"

- name: Set caddy UID fact
  ansible.builtin.set_fact:
    caddy_uid: "{{ getent_passwd[caddy_user][1] }}"

- name: Check if caddy service is running
  ansible.builtin.systemd:
    name: caddy.service
    scope: user
  become: true
  become_user: "{{ caddy_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ caddy_uid }}"
  register: caddy_service_status
  retries: 10
  delay: 5
  until: caddy_service_status.status.ActiveState is defined and caddy_service_status.status.ActiveState == 'active'

- name: Assert caddy service is active
  ansible.builtin.assert:
    that:
      - caddy_service_status.status.ActiveState == 'active'
